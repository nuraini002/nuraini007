<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Anjani — My Little World 🌿</title>

    <style>
        /* =========================
           RESET
        ========================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        :root {
            --green-dark: #315c4a;
            --green: #668f75;
            --sage: #a8bfa8;
            --cream: #f7f3e8;
            --white: #ffffff;
            --brown: #6b5142;
            --brown-light: #cbb8a5;
            --black: #242424;
            --pink: #e8b8b8;
        }

        body {
            font-family: "Trebuchet MS", Arial, sans-serif;
            background: var(--cream);
            color: var(--black);
            overflow-x: hidden;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        img {
            max-width: 100%;
            display: block;
        }

        /* =========================
           DECORATION
        ========================== */

        .leaf {
            position: fixed;
            font-size: 25px;
            opacity: 0.15;
            pointer-events: none;
            z-index: -1;
        }

        .leaf.one {
            top: 15%;
            left: 3%;
            transform: rotate(-25deg);
        }

        .leaf.two {
            top: 70%;
            right: 4%;
            transform: rotate(25deg);
        }

        .leaf.three {
            top: 45%;
            left: 95%;
            transform: rotate(50deg);
        }

        /* =========================
           NAVBAR
        ========================== */

        header {
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            background: rgba(247, 243, 232, 0.92);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(49, 92, 74, 0.12);
        }

        nav {
            max-width: 1150px;
            margin: auto;
            padding: 18px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 23px;
            font-weight: bold;
            color: var(--green-dark);
        }

        .logo span {
            color: var(--brown);
        }

        .nav-links {
            display: flex;
            gap: 25px;
            list-style: none;
        }

        .nav-links a {
            font-size: 14px;
            font-weight: bold;
            transition: 0.3s;
        }

        .nav-links a:hover {
            color: var(--green);
        }

        .menu-btn {
            display: none;
            border: none;
            background: none;
            font-size: 27px;
            cursor: pointer;
            color: var(--green-dark);
        }

        /* =========================
           HERO
        ========================== */

        .hero {
            min-height: 100vh;
            max-width: 1150px;
            margin: auto;
            padding: 130px 25px 70px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px;
            align-items: center;
        }

        .hero-text small {
            color: var(--green);
            font-weight: bold;
            letter-spacing: 2px;
        }

        .hero-text h1 {
            font-size: clamp(50px, 8vw, 90px);
            line-height: 0.95;
            color: var(--green-dark);
            margin: 15px 0;
        }

        .hero-text h1 span {
            color: var(--brown);
        }

        .hero-text p {
            max-width: 530px;
            line-height: 1.8;
            color: #555;
        }

        .hero-buttons {
            margin-top: 25px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 13px 22px;
            border-radius: 30px;
            background: var(--green-dark);
            color: white;
            font-weight: bold;
            transition: 0.3s;
            display: inline-block;
        }

        .btn:hover {
            transform: translateY(-3px);
            background: var(--brown);
        }

        .btn-outline {
            background: transparent;
            color: var(--green-dark);
            border: 2px solid var(--green-dark);
        }

        .hero-card {
            position: relative;
            display: flex;
            justify-content: center;
        }

        .profile-card {
            width: 330px;
            height: 410px;
            background: var(--white);
            border-radius: 180px 180px 30px 30px;
            padding: 12px;
            box-shadow: 0 20px 50px rgba(49, 92, 74, 0.15);
            transform: rotate(3deg);
        }

        .profile-placeholder {
            height: 100%;
            border-radius: 170px 170px 22px 22px;
            background: linear-gradient(145deg, var(--sage), var(--green-dark));
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 70px;
            color: white;
            overflow: hidden;
        }

        .profile-placeholder img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .flower {
            position: absolute;
            font-size: 50px;
        }

        .flower.one {
            top: -25px;
            right: 30px;
        }

        .flower.two {
            bottom: 15px;
            left: 15px;
            font-size: 40px;
        }

        /* =========================
           GENERAL SECTION
        ========================== */

        section {
            padding: 100px 25px;
        }

        .section-inner {
            max-width: 1100px;
            margin: auto;
        }

        .section-title {
            text-align: center;
            margin-bottom: 50px;
        }

        .section-title small {
            color: var(--green);
            font-weight: bold;
            letter-spacing: 2px;
        }

        .section-title h2 {
            font-size: 42px;
            color: var(--green-dark);
            margin-top: 8px;
        }

        .section-title p {
            margin: 12px auto 0;
            max-width: 600px;
            color: #666;
            line-height: 1.7;
        }

        /* =========================
           ABOUT
        ========================== */

        .about {
            background: var(--white);
        }

        .about-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px;
            align-items: center;
        }

        .about-text p {
            line-height: 1.9;
            margin-bottom: 20px;
            color: #555;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .info-box {
            background: var(--cream);
            padding: 20px;
            border-radius: 20px;
            border: 1px solid rgba(49, 92, 74, 0.1);
        }

        .info-box span {
            display: block;
            font-size: 12px;
            color: var(--green);
            margin-bottom: 5px;
            font-weight: bold;
        }

        .info-box strong {
            color: var(--brown);
        }

        /* =========================
           HOBBIES
        ========================== */

        .hobby-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
        }

        .hobby-card {
            background: white;
            padding: 30px 20px;
            border-radius: 25px;
            text-align: center;
            transition: 0.3s;
            border: 1px solid rgba(49, 92, 74, 0.08);
        }

        .hobby-card:hover {
            transform: translateY(-8px) rotate(1deg);
            box-shadow: 0 15px 30px rgba(49, 92, 74, 0.12);
        }

        .hobby-icon {
            font-size: 40px;
            margin-bottom: 15px;
        }

        .hobby-card h3 {
            color: var(--green-dark);
            margin-bottom: 8px;
        }

        .hobby-card p {
            font-size: 14px;
            line-height: 1.6;
            color: #666;
        }

        /* =========================
           EXTRACURRICULAR
        ========================== */

        .extra {
            background: var(--green-dark);
            color: white;
        }

        .extra .section-title h2,
        .extra .section-title small {
            color: white;
        }

        .extra .section-title p {
            color: #dce8df;
        }

        .extra-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
        }

        .extra-card {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 25px;
            padding: 35px;
            transition: 0.3s;
        }

        .extra-card:hover {
            transform: translateY(-7px);
            background: rgba(255,255,255,0.15);
        }

        .extra-card .icon {
            font-size: 45px;
        }

        .extra-card h3 {
            font-size: 25px;
            margin: 15px 0 10px;
        }

        .extra-card p {
            color: #e2eee5;
            line-height: 1.7;
        }

        .tag {
            display: inline-block;
            margin-top: 18px;
            padding: 7px 13px;
            border-radius: 20px;
            background: var(--sage);
            color: var(--green-dark);
            font-size: 12px;
            font-weight: bold;
        }

        /* =========================
           ART GALLERY
        ========================== */

        .gallery {
            columns: 3 250px;
            column-gap: 18px;
        }

        .gallery-item {
            margin-bottom: 18px;
            break-inside: avoid;
            border-radius: 20px;
            overflow: hidden;
            background: white;
            border: 5px solid white;
            box-shadow: 0 8px 20px rgba(0,0,0,0.06);
        }

        .gallery-item img {
            width: 100%;
            min-height: 180px;
            object-fit: cover;
        }

        .gallery-caption {
            padding: 12px;
            font-size: 13px;
            color: var(--brown);
        }

        /* =========================
           MUSIC
        ========================== */

        .music {
            background: #efe9da;
        }

        .music-player {
            max-width: 700px;
            margin: auto;
            background: white;
            border-radius: 30px;
            padding: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.08);
        }

        .music-top {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .album {
            width: 100px;
            height: 100px;
            border-radius: 18px;
            background: var(--green);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            flex-shrink: 0;
        }

        .music-info h3 {
            color: var(--green-dark);
        }

        .music-info p {
            color: #777;
            margin-top: 5px;
        }

        .music-list {
            margin-top: 25px;
        }

        .song {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 5px;
            border-bottom: 1px solid #eee;
        }

        .song-name {
            font-weight: bold;
        }

        .song button {
            border: none;
            background: var(--sage);
            color: var(--green-dark);
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
        }

        /* =========================
           RIN CORNER
        ========================== */

        .rin {
            background: var(--white);
        }

        .rin-card {
            background: var(--cream);
            padding: 30px;
            border-radius: 30px;
            max-width: 900px;
            margin: auto;
        }

        .rin-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .rin-header h3 {
            color: var(--green-dark);
            font-size: 30px;
        }

        .rin-header p {
            color: var(--brown);
            margin-top: 8px;
        }

        .rin-gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .rin-photo {
            aspect-ratio: 1;
            border-radius: 20px;
            overflow: hidden;
            background: var(--sage);
            position: relative;
        }

        .rin-photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .rin-placeholder {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }

        /* =========================
           JAPANESE JOURNEY
        ========================== */

        .japanese {
            background: var(--green-dark);
            color: white;
        }

        .japanese .section-title h2,
        .japanese .section-title small {
            color: white;
        }

        .japanese .section-title p {
            color: #dce8df;
        }

        .japanese-box {
            max-width: 850px;
            margin: auto;
            background: rgba(255,255,255,0.1);
            border-radius: 30px;
            padding: 35px;
        }

        .jp-title {
            text-align: center;
            font-size: 35px;
            margin-bottom: 30px;
        }

        .jp-skills {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .jp-skill {
            background: rgba(255,255,255,0.1);
            padding: 25px;
            border-radius: 20px;
            text-align: center;
        }

        .jp-skill h4 {
            margin-top: 10px;
        }

        /* =========================
           DREAM
        ========================== */

        .dream {
            text-align: center;
        }

        .dream-card {
            max-width: 750px;
            margin: auto;
            background: white;
            border-radius: 35px;
            padding: 50px 30px;
            box-shadow: 0 15px 35px rgba(49,92,74,0.1);
        }

        .dream-icon {
            font-size: 70px;
        }

        .dream-card h3 {
            font-size: 35px;
            color: var(--green-dark);
            margin: 15px 0;
        }

        .dream-card p {
            line-height: 1.8;
            color: #666;
        }

        /* =========================
           CONTACT
        ========================== */

        .contact {
            background: var(--brown);
            color: white;
            text-align: center;
        }

        .contact h2 {
            font-size: 45px;
            margin-bottom: 15px;
        }

        .contact p {
            color: #eee;
            margin-bottom: 30px;
        }

        .contact-links {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .contact-link {
            background: white;
            color: var(--brown);
            padding: 12px 20px;
            border-radius: 30px;
            font-weight: bold;
            transition: 0.3s;
        }

        .contact-link:hover {
            transform: translateY(-4px);
            background: var(--sage);
        }

        /* =========================
           FOOTER
        ========================== */

        footer {
            text-align: center;
            padding: 25px;
            background: #30251f;
            color: #ddd;
            font-size: 13px;
        }

        /* =========================
           ANIMATION
        ========================== */

        .reveal {
            opacity: 0;
            transform: translateY(30px);
            transition: 0.8s ease;
        }

        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

        /* =========================
           RESPONSIVE
        ========================== */

        @media (max-width: 850px) {

            .nav-links {
                position: absolute;
                top: 70px;
                right: 20px;
                width: 220px;
                padding: 20px;
                background: white;
                border-radius: 20px;
                box-shadow: 0 15px 30px rgba(0,0,0,0.1);
                flex-direction: column;
                display: none;
            }

            .nav-links.show {
                display: flex;
            }

            .menu-btn {
                display: block;
            }

            .hero {
                grid-template-columns: 1fr;
                text-align: center;
            }

            .hero-text p {
                margin: auto;
            }

            .hero-buttons {
                justify-content: center;
            }

            .hero-card {
                order: -1;
            }

            .about-grid {
                grid-template-columns: 1fr;
            }

            .hobby-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .extra-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 550px) {

            section {
                padding: 75px 18px;
            }

            .section-title h2 {
                font-size: 32px;
            }

            .profile-card {
                width: 270px;
                height: 340px;
            }

            .info-grid {
                grid-template-columns: 1fr;
            }

            .hobby-grid {
                grid-template-columns: 1fr;
            }

            .rin-gallery {
                grid-template-columns: repeat(2, 1fr);
            }

            .jp-skills {
                grid-template-columns: 1fr;
            }

            .contact h2 {
                font-size: 35px;
            }
        }
    </style>
</head>

<body>

    <!-- DECORATION -->
    <div class="leaf one">🌿</div>
    <div class="leaf two">🌿</div>
    <div class="leaf three">🍃</div>


    <!-- =========================
         NAVBAR
    ========================== -->

    <header>
        <nav>
            <a href="#home" class="logo">anjani<span>.♡</span></a>

            <button class="menu-btn" id="menuBtn">
                ☰
            </button>

            <ul class="nav-links" id="navLinks">
                <li><a href="#about">About</a></li>
                <li><a href="#hobbies">Hobbies</a></li>
                <li><a href="#extra">School</a></li>
                <li><a href="#art">Art</a></li>
                <li><a href="#rin">Rin</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>


    <!-- =========================
         HERO
    ========================== -->

    <main>

        <section class="hero" id="home">

            <div class="hero-text reveal">

                <small>WELCOME TO MY LITTLE WORLD 🌿</small>

                <h1>
                    Hi, I'm
                    <span>Anjani.</span>
                </h1>
